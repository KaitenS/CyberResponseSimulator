name: Discord Notifications

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - closed
      - reopened
      - synchronize

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: |
          EVENT="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"

          if [ "$EVENT" = "push" ]; then

            BRANCH="${{ github.ref_name }}"
            AUTHOR="${{ github.actor }}"
            COMMIT="${{ github.event.head_commit.message }}"
            SHA="${{ github.sha }}"
            URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

            PAYLOAD=$(cat <<EOF
          {
            "content": "",
            "embeds": [{
              "title": "🟢 PUSH → MAIN",
              "description": "**${{ github.repository }}**\n\n\`${BRANCH}\` → \`main\`",
              "color": 5763719,
              "fields": [
                {
                  "name": "📝 Commit",
                  "value": "${COMMIT}",
                  "inline": false
                },
                {
                  "name": "👤 Autor",
                  "value": "${AUTHOR}",
                  "inline": true
                },
                {
                  "name": "🔗 Enlace",
                  "value": "[Ver commit](${URL})",
                  "inline": true
                }
              ],
              "footer": {
                "text": "Cyber Response Simulator • GitHub"
              }
            }]
          }
          EOF
          )

          else

            SOURCE="${{ github.event.pull_request.head.ref }}"
            TARGET="${{ github.event.pull_request.base.ref }}"
            AUTHOR="${{ github.event.pull_request.user.login }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_URL="${{ github.event.pull_request.html_url }}"

            if [ "$ACTION" = "closed" ]; then

              if [ "${{ github.event.pull_request.merged }}" = "true" ]; then

                PAYLOAD=$(cat <<EOF
          {
            "content": "@everyone",
            "allowed_mentions": {
              "parse": ["everyone"]
            },
            "embeds": [{
              "title": "🟣 PULL REQUEST MERGED",
              "description": "**${{ github.repository }}**\n\n\`${SOURCE}\` → \`${TARGET}\`",
              "color": 10181046,
              "fields": [
                {
                  "name": "🔀 Pull Request",
                  "value": "**#${PR_NUMBER} — ${PR_TITLE}**",
                  "inline": false
                },
                {
                  "name": "👤 Autor",
                  "value": "${AUTHOR}",
                  "inline": true
                },
                {
                  "name": "✅ Estado",
                  "value": "Fusionado correctamente",
                  "inline": true
                },
                {
                  "name": "🔗 Enlace",
                  "value": "[Ver Pull Request](${PR_URL})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Cyber Response Simulator • GitHub"
              }
            }]
          }
          EOF
          )

              else

                PAYLOAD=$(cat <<EOF
          {
            "content": "",
            "embeds": [{
              "title": "🔴 PULL REQUEST CERRADO",
              "description": "**${{ github.repository }}**\n\n\`${SOURCE}\` → \`${TARGET}\`",
              "color": 15548997,
              "fields": [
                {
                  "name": "🔀 Pull Request",
                  "value": "**#${PR_NUMBER} — ${PR_TITLE}**",
                  "inline": false
                },
                {
                  "name": "👤 Autor",
                  "value": "${AUTHOR}",
                  "inline": true
                },
                {
                  "name": "❌ Estado",
                  "value": "Cerrado sin fusionar",
                  "inline": true
                },
                {
                  "name": "🔗 Enlace",
                  "value": "[Ver Pull Request](${PR_URL})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Cyber Response Simulator • GitHub"
              }
            }]
          }
          EOF
          )

              fi

            else

              PAYLOAD=$(cat <<EOF
          {
            "content": "",
            "embeds": [{
              "title": "🔵 PULL REQUEST",
              "description": "**${{ github.repository }}**\n\n\`${SOURCE}\` → \`${TARGET}\`",
              "color": 3447003,
              "fields": [
                {
                  "name": "🔀 Pull Request",
                  "value": "**#${PR_NUMBER} — ${PR_TITLE}**",
                  "inline": false
                },
                {
                  "name": "👤 Autor",
                  "value": "${AUTHOR}",
                  "inline": true
                },
                {
                  "name": "📌 Acción",
                  "value": "${ACTION}",
                  "inline": true
                },
                {
                  "name": "🔗 Enlace",
                  "value": "[Ver Pull Request](${PR_URL})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Cyber Response Simulator • GitHub"
              }
            }]
          }
          EOF
          )

            fi
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"